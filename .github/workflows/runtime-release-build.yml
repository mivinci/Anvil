name: Runtime release build

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      macos_certificate_p12:
        required: false
      macos_certificate_password:
        required: false
      runtime_signing_key:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect existing version release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      published: ${{ steps.inspect.outputs.published }}
      build_required: ${{ steps.artifacts.outputs.build_required }}
      matrix: ${{ steps.artifacts.outputs.matrix }}
      version: ${{ steps.artifacts.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect immutable version identity
        id: inspect
        run: python3 .github/scripts/publish_release.py inspect --product runtime
      - name: Find retained platform artifacts
        id: artifacts
        if: steps.inspect.outputs.published != 'true'
        run: python3 .github/scripts/release_artifacts.py plan --product runtime

  build:
    needs: inspect
    if: needs.inspect.outputs.published != 'true' && needs.inspect.outputs.build_required == 'true'
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      ANVIL_RUNTIME_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/runtime-updates/runtime-index.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Verify fixed release checkout
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_dispatch|workflow_run) ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Runtime update public key
        env:
          PUBLIC_KEY: ${{ vars.ANVIL_RUNTIME_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_KEY" || { echo "ANVIL_RUNTIME_UPDATE_PUBLIC_KEY is required." >&2; exit 1; }
          printf 'ANVIL_RUNTIME_UPDATE_PUBLIC_KEY=%s\n' "$PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Verify workspace and lock versions
        shell: bash
        run: |
          python .github/scripts/release.py check --product runtime
          python - <<'PYCODE'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != f'runtime/v{version}':
              raise SystemExit('Runtime tag does not match workspace version')
          PYCODE
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Import macOS Runtime signing certificate
        if: runner.os == 'macOS'
        env:
          ANVIL_MACOS_CERTIFICATE_P12: ${{ secrets.macos_certificate_p12 }}
          ANVIL_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.macos_certificate_password }}
          GITHUB_STATE_FILE: ${{ runner.temp }}/anvil-signing-state
        run: python3 .github/scripts/macos_signing.py setup
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: 22.17.0
      - name: Build Runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANVIL_RUNTIME_UPDATE_PUBLIC_KEY"
          cargo build --locked --release -p anvil --target ${{ matrix.target }}
      - name: Sign macOS Runtime
        if: runner.os == 'macOS'
        run: node scripts/sign-runtime.mjs target/${{ matrix.target }}/release/anvil ${{ matrix.target }}
      - name: Verify binary version and Runtime API
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#runtime/v}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="target/${{ matrix.target }}/release/anvil.exe"
          else
            binary="target/${{ matrix.target }}/release/anvil"
          fi
          actual="$("$binary" --version)"
          if [ "$actual" != "anvil $version" ]; then
            echo "Binary reports '$actual', expected 'anvil $version'" >&2
            exit 1
          fi
          python .github/scripts/validate_runtime_api.py "$binary"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#*/v}"
          name="anvil-${version}-${{ matrix.target }}"
          mkdir -p dist/staging
          cp "target/${{ matrix.target }}/release/anvil" dist/staging/
          cp LICENSE README.md dist/staging/
          tar -czf "dist/${name}.tar.gz" -C dist/staging .
          cp "target/${{ matrix.target }}/release/anvil" "dist/${name}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^runtime/v', ''
          $name = "anvil-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist/staging -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/anvil.exe" dist/staging/
          Copy-Item LICENSE dist/staging/
          Copy-Item README.md dist/staging/
          Compress-Archive -Path dist/staging/* -DestinationPath "dist/$name.zip"
          Copy-Item "target/${{ matrix.target }}/release/anvil.exe" "dist/$name.exe"
      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        env:
          GITHUB_STATE_FILE: ${{ runner.temp }}/anvil-signing-state
        run: python3 .github/scripts/macos_signing.py cleanup
      - uses: actions/upload-artifact@v4
        with:
          name: release-runtime-${{ needs.inspect.outputs.version }}-${{ inputs.sha }}-${{ matrix.target }}
          path: dist/anvil-*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Verify public assets and reconcile feeds
    needs: [inspect, build]
    if: >-
      ${{ always() && !cancelled() && needs.inspect.result == 'success' &&
          (needs.build.result == 'success' ||
           (needs.build.result == 'skipped' &&
            (needs.inspect.outputs.published == 'true' || needs.inspect.outputs.build_required == 'false'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.runtime_signing_key }}
      UPDATE_PUBLIC_KEY: ${{ vars.ANVIL_RUNTIME_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Verify fixed release checkout
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in workflow_dispatch|workflow_run) ;; *) exit 1 ;; esac
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified retained and newly built artifacts
        if: needs.inspect.outputs.published != 'true'
        run: python3 .github/scripts/release_artifacts.py collect --product runtime
      - name: Install signing dependency
        run: python3 -m pip install --disable-pip-version-check pynacl
      - name: Publish verified version and reconcile signed feeds
        run: python3 .github/scripts/publish_release.py publish --product runtime
