name: Rust

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-scripts:
    name: Signing scripts (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test scripts/runtime-signing.test.mjs
      - run: python3 -m unittest discover -s .github/scripts/tests -p test_macos_signing.py

  java:
    name: Java and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Run fixture tests without proxies
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          export NO_PROXY='*' no_proxy='*'
          cargo test --locked -p anvil -p anvil-core -- --test-threads=1
      - run: cargo clippy --locked -p anvil -p anvil-core --all-targets -- -D warnings
      - run: cargo build --locked -p anvil

  desktop:
    name: Tauri shell (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Shell tests and clippy (need the Tauri system libraries)
        run: |
          cargo test --locked -p anvil-shell -- --test-threads=1
          cargo clippy --locked -p anvil-shell --all-targets -- -D warnings
      - run: npm ci
      - run: npm run desktop:check
      - run: node --test apps/desktop/tests/modpack-import.test.mjs apps/desktop/tests/modpack-export.test.mjs
      - run: node --experimental-strip-types --test apps/desktop/tests/client-name.test.ts apps/desktop/tests/mod-discovery-context.test.ts
      - name: Build Desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/shell/src-tauri/tauri.conf.json').version")"
          if [[ "$version" == *-* ]]; then
            cd apps/shell
            npx tauri build --bundles deb
          else
            npm run desktop:build
          fi
