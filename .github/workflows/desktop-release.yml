name: Desktop release

on:
  push:
    tags:
      - 'desktop/v*'
      - 'desktop-test/v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ANVIL_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref_name, 'desktop-test/') && 'desktop-updates-test' || 'desktop-updates-stable' }}/${{ matrix.target }}.json
      ANVIL_RUNTIME_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref_name, 'desktop-test/') && 'runtime-updates-test' || 'runtime-updates' }}/runtime-index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select channel update public key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_APP_PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_UPDATE_PUBLIC_KEY }}
          TEST_APP_PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_TEST_UPDATE_PUBLIC_KEY }}
          STABLE_RUNTIME_PUBLIC_KEY: ${{ vars.ANVIL_RUNTIME_UPDATE_PUBLIC_KEY }}
          TEST_RUNTIME_PUBLIC_KEY: ${{ vars.ANVIL_RUNTIME_TEST_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == desktop-test/* ]]; then
            app_public_key="$TEST_APP_PUBLIC_KEY"
            runtime_public_key="$TEST_RUNTIME_PUBLIC_KEY"
            app_key_name=ANVIL_DESKTOP_TEST_UPDATE_PUBLIC_KEY
            runtime_key_name=ANVIL_RUNTIME_TEST_UPDATE_PUBLIC_KEY
          else
            app_public_key="$STABLE_APP_PUBLIC_KEY"
            runtime_public_key="$STABLE_RUNTIME_PUBLIC_KEY"
            app_key_name=ANVIL_DESKTOP_UPDATE_PUBLIC_KEY
            runtime_key_name=ANVIL_RUNTIME_UPDATE_PUBLIC_KEY
          fi
          test -n "$app_public_key" || { echo "$app_key_name is required for this release channel." >&2; exit 1; }
          test -n "$runtime_public_key" || { echo "$runtime_key_name is required for this release channel." >&2; exit 1; }
          printf 'ANVIL_UPDATE_PUBLIC_KEY=%s\nANVIL_RUNTIME_UPDATE_PUBLIC_KEY=%s\n' \
            "$app_public_key" "$runtime_public_key" >> "$GITHUB_ENV"
      - name: Validate tag and update configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python .github/scripts/validate_desktop_release.py "$RELEASE_TAG"
          python -c 'import os, sys; missing = [name for name in ("ANVIL_UPDATE_PUBLIC_KEY", "ANVIL_RUNTIME_UPDATE_PUBLIC_KEY") if not os.environ.get(name)]; print("missing required public key variable(s): " + ", ".join(missing), file=sys.stderr) if missing else None; sys.exit(bool(missing))'
        shell: bash
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Desktop frontend
        run: npm run desktop:check
      - name: Build Desktop installers
        run: npm run desktop:build
      - name: Package update payload and collect installers
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^desktop(-test)?/v', ''
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python .github/scripts/package_desktop_app.py apps/desktop/baseline "dist/anvil-desktop-$version-${{ matrix.target }}.tar.gz"
          python .github/scripts/collect_desktop_installers.py . dist $version
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Desktop release and update feed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check pynacl
      - name: Select channel update signing keys
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STABLE_SIGNING_KEY: ${{ secrets.ANVIL_DESKTOP_UPDATE_SIGNING_KEY }}
          TEST_SIGNING_KEY: ${{ secrets.ANVIL_DESKTOP_TEST_UPDATE_SIGNING_KEY }}
          STABLE_PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_UPDATE_PUBLIC_KEY }}
          TEST_PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_TEST_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == desktop-test/* ]]; then
            signing_key="$TEST_SIGNING_KEY"
            public_key="$TEST_PUBLIC_KEY"
            key_name=ANVIL_DESKTOP_TEST_UPDATE
          else
            signing_key="$STABLE_SIGNING_KEY"
            public_key="$STABLE_PUBLIC_KEY"
            key_name=ANVIL_DESKTOP_UPDATE
          fi
          test -n "$signing_key" || { echo "${key_name}_SIGNING_KEY is required for this release channel." >&2; exit 1; }
          test -n "$public_key" || { echo "${key_name}_PUBLIC_KEY is required for this release channel." >&2; exit 1; }
          printf 'SIGNING_KEY=%s\nUPDATE_PUBLIC_KEY=%s\n' "$signing_key" "$public_key" >> "$GITHUB_ENV"
      - name: Validate release signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || { echo "Desktop update signing key is required for this release channel." >&2; exit 1; }
          test -n "$UPDATE_PUBLIC_KEY" || { echo "ANVIL_DESKTOP_UPDATE_PUBLIC_KEY is required." >&2; exit 1; }
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Create or resume versioned release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop/v}"
          version="${version#desktop-test/v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "Versioned release is already published; reusing its immutable payloads."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "Anvil Desktop v$version"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$RELEASE_TAG" == desktop-test/* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false
            release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" -X PATCH -F make_latest=false >/dev/null
          fi
      - name: Download published App update payloads
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop/v}"
          version="${version#desktop-test/v}"
          mkdir -p dist/published-packages
          gh release download "$RELEASE_TAG" --dir dist/published-packages --pattern "anvil-desktop-${version}-*.tar.gz"
          cp dist/published-packages/*.tar.gz dist/
      - name: Sign update manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop/v}"
          version="${version#desktop-test/v}"
          RELEASE_VERSION="$version" python3 .github/scripts/sign_desktop_updates.py dist
      - name: Update channel manifest pointer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == desktop-test/* ]]; then
            feed_tag="desktop-updates-test"
            title="Anvil Desktop test update feed"
          else
            feed_tag="desktop-updates-stable"
            title="Anvil Desktop stable update feed"
          fi
          if ! gh release view "$feed_tag" >/dev/null 2>&1; then
            gh release create "$feed_tag" --draft --prerelease --target "$GITHUB_SHA" \
              --title "$title" --notes "Mutable signed Desktop update manifests."
          fi
          gh release upload "$feed_tag" dist/update-manifests/*.json --clobber
          gh release edit "$feed_tag" --draft=false --prerelease
