name: Desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve release and approval policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact main commit and approval environment
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py resolve --product desktop --environment anvil-release
      - name: Validate Desktop manifests and public configuration
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          APP_PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_TEST_UPDATE_PUBLIC_KEY }}
          RUNTIME_PUBLIC_KEY: ${{ vars.ANVIL_RUNTIME_UPDATE_PUBLIC_KEY }}
        run: |
          python3 .github/scripts/validate_desktop_release.py "$RELEASE_TAG"
          python3 - <<'PYCODE'
          import os
          for name in ('APP_PUBLIC_KEY', 'RUNTIME_PUBLIC_KEY'):
              value = os.environ[name]
              if len(value) != 64 or any(c not in '0123456789abcdefABCDEF' for c in value):
                  raise SystemExit(f'{name} must be a 32-byte hex public key')
          PYCODE

  approve:
    name: Approve and tag ${{ needs.validate.outputs.tag }}
    needs: validate
    environment: anvil-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing dependency
        run: python3 -m pip install --disable-pip-version-check pynacl
      - name: Validate signing identity before tagging
        env:
          SIGNING_KEY: ${{ secrets.ANVIL_DESKTOP_TEST_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.ANVIL_DESKTOP_TEST_UPDATE_PUBLIC_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os
          from nacl.signing import SigningKey
          try:
              key = SigningKey(bytes.fromhex(os.environ['SIGNING_KEY']))
              valid = key.verify_key.encode().hex() == os.environ['PUBLIC_KEY'].lower()
          except (ValueError, TypeError):
              valid = False
          if not valid:
              raise SystemExit('Desktop signing key is missing, invalid or does not match the configured public key')
          PYCODE
      - name: Create immutable release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA" || {
              echo 'Existing release tag points to another commit; refusing to move it.' >&2
              exit 1
            }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Anvil Desktop ${RELEASE_TAG#desktop/v}"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          printf '## Approved release\nTag: `%s`\nCommit: `%s`\n' "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build and publish approved Desktop release
    needs: [validate, approve]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release-build.yml
    with:
      sha: ${{ needs.validate.outputs.sha }}
      tag: ${{ needs.validate.outputs.tag }}
    secrets:
      desktop_update_signing_key: ${{ secrets.ANVIL_DESKTOP_TEST_UPDATE_SIGNING_KEY }}
