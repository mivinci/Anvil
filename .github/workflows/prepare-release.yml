name: Prepare release

on:
  workflow_dispatch:
    inputs:
      desktop_version:
        description: 'Desktop version (e.g. 26.0.0-alpha.3); leave empty to skip'
        required: false
        type: string
      runtime_version:
        description: 'Runtime version; leave empty to skip'
        required: false
        type: string
      notes:
        description: 'User-facing release notes (can also edit the PR before merging)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Prepare release must run on main.' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare version PR and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 .github/scripts/release.py prepare --desktop-version "$DESKTOP_VERSION" --runtime-version "$RUNTIME_VERSION" --notes "$RELEASE_NOTES"
