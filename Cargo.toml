[workspace]
members = ["crates/*", "apps/shell/src-tauri"]
default-members = ["crates/anvil", "crates/anvil-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anvil-core = { path = "crates/anvil-core" }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
flate2 = "1.1"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
q2q-http = { git = "https://github.com/mivinci/Q2Q.git", rev = "5e98cfc55b2712dfc6741d3f17c0cc14fcb57353" }
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.11"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
