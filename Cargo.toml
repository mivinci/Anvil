[workspace]
members = ["crates/*"]
default-members = ["crates/anvil", "crates/anvil-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
anvil-core = { path = "crates/anvil-core" }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
flate2 = "1.1"
q2q-http = { git = "https://github.com/mivinci/Q2Q.git", rev = "5e98cfc55b2712dfc6741d3f17c0cc14fcb57353" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
slint = { version = "1.14", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
